# Descarga los datos, compila la app y la publica en GitHub Pages.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar mapa

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # todos los lunes, para refrescar los recorridos

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Parte de lo ya publicado: si una fuente falla, esa capa conserva los
      # datos anteriores en vez de quedar vacía.
      - name: Traer datos publicados
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data"
          for f in manifest.json subte.geojson trenes.geojson colectivos.geojson autopistas.geojson ciclovias.geojson; do
            curl -fsSL -o "public/data/$f" "$base/$f" || rm -f "public/data/$f"
          done
      # Si alguna fuente falla y no hay datos previos, la app consulta
      # OpenStreetMap en vivo para esa capa.
      - run: npm run datos
        continue-on-error: true
      - run: npm run build
        env:
          # Opcional: habilita Google Maps como mapa base (ver README).
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
