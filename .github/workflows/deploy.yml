# Descarga los datos, compila la app y la publica en GitHub Pages.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Publicar mapa

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # todos los lunes, para refrescar los recorridos

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Si alguna fuente falla, la app consulta OpenStreetMap en vivo para esa capa.
      - run: npm run datos
        continue-on-error: true
      - run: npm run build
        env:
          # Opcional: habilita Google Maps como mapa base (ver README).
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
