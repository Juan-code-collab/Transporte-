# Temporal: prueba la descarga real desde la rama. Se borra después.
name: Diagnóstico de fuentes
on:
  push:
    branches: ['claude/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - run: npm run datos
        continue-on-error: true
      - run: |
          node --input-type=module -e '
          import { readFileSync } from "fs";
          import { lineaTren, lineaDe, calleDe } from "./src/geo.js";
          const leer = (k) => JSON.parse(readFileSync(`public/data/${k}.geojson`));
          console.log("trenes:", [...new Set(leer("trenes").features.map((f) => lineaTren(f.properties)))].join(", "));
          console.log("subte:", [...new Set(leer("subte").features.map((f) => lineaDe(f.properties)))].join(", "));
          console.log("calles ej:", [...new Set(leer("ciclovias").features.map((f) => calleDe(f.properties)))].slice(0, 15).join(" | "));
          for (const k of ["subte", "trenes", "colectivos", "ciclovias", "autopistas"]) {
            const d = leer(k); const por = {};
            for (const f of d.features) for (const c of f.properties._comunas ?? ["sin"]) por[c] = (por[c] ?? 0) + 1;
            console.log(k, JSON.stringify(por));
          }
          const c5 = leer("colectivos").features.filter((f) => f.properties._comunas?.includes(5)).map((f) => lineaDe(f.properties));
          console.log("colectivos comuna 5:", [...new Set(c5)].sort((a, b) => a - b).join(" "));'
          ls -la public/data
