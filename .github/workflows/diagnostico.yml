# Temporal: prueba la descarga real desde la rama. Se borra después.
name: Diagnóstico de fuentes
on:
  push:
    branches: ['claude/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - run: npm run datos
        continue-on-error: true
      - run: |
          node --input-type=module -e '
          import { readFileSync } from "fs";
          import { lineaDe, jurisdiccionDe } from "./src/geo.js";
          const d = JSON.parse(readFileSync("public/data/colectivos.geojson"));
          const por = {};
          for (const f of d.features) { const j = jurisdiccionDe(f.properties); (por[j] ??= new Set()).add(lineaDe(f.properties)); }
          for (const [j, s] of Object.entries(por)) console.log(j, s.size, [...s].sort((a, b) => a - b).join(" "));'
          ls -la public/data
