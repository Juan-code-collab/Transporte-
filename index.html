<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transporte CABA</title>
    <meta name="description" content="Mapa de la Ciudad de Buenos Aires con subtes, colectivos, trenes, autopistas y ciclovías." />
  </head>
  <body>
    <aside id="panel">
      <header>
        <h1>Transporte CABA</h1>
        <button id="plegar" type="button" aria-expanded="true" aria-controls="contenido">Ocultar</button>
      </header>
      <div id="contenido">
        <section>
          <h2>Comuna</h2>
          <select id="filtro-comuna" aria-label="Filtrar por comuna">
            <option value="">Toda la Ciudad</option>
          </select>
          <p class="resumen" id="barrios-comuna"></p>
        </section>

        <section>
          <h2>Capas</h2>
          <ul id="capas"></ul>
        </section>

        <footer id="fuentes"></footer>
        <p class="resumen" id="version"></p>
      </div>
    </aside>
    <main id="mapa" aria-label="Mapa de transporte de la Ciudad de Buenos Aires"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
